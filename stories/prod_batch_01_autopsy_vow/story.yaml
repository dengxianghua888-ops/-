      hook: 第一刀落下前，他把结婚戒指摘进证物袋。
    - path: final-chapters/ch04.md
      title: 第四章
      hook: 他在我的指甲缝里看见一抹不属于我的蓝色车漆。
    - path: final-chapters/ch05.md
      title: 第五章
      hook: 许知遥打来电话，问尸检做到哪一步了。
    - path: final-chapters/ch06.md
      title: 第六章
      hook: 他的刀停在我的下腹，记录员忽然抬头。
    - path: final-chapters/ch07.md
      title: 第七章
      hook: 陆谨言看见了孩子。
    - path: final-chapters/ch08.md
      title: 第八章
      hook: 他从我随身证物里翻出那枚胎心钥匙扣。
    - path: final-chapters/ch09.md
      title: 第九章
      hook: 钥匙扣里传出我没来得及发给他的胎心声。
    - path: final-chapters/ch10.md
      title: 第十章
      hook: 陆谨言只重复：“录音恢复了。”
    - path: final-chapters/ch11.md
      title: 第十一章
      hook: 许知遥在电话那头说漏了隧道第二道闸。
    - path: final-chapters/ch12.md
      title: 第十二章
      hook: 车辆控制数据打开前，陆谨言签下停职申请。
    - path: final-chapters/ch13.md
      title: 第十三章
      hook: 许知遥被带走时，还在喊陆谨言会原谅她。
    - path: final-chapters/ch14.md
      title: 第十四章
      hook: 废弃收费站的第一盏夜灯亮起，他把空儿童安全座椅放在窗边。
    - path: final-chapters/ch15.md
      title: 第十五章
      hook: 第五年雪夜，他终于按下那段胎心录音。
    - path: final-chapters/ch16.md
      title: 第十六章
      hook: 胎心录音停下时，我终于看见，收费站外有了光。
