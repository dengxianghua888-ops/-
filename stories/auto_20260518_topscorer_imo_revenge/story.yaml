  files:
  - path: final-chapters/ch01.md
    hook: 110 接通的瞬间未婚夫的解约短信也跟着震上屏幕——这不是断亲，是灭门。
  - path: final-chapters/ch02.md
    hook: 撬锁声踩着警笛进来——"哥哥回来啦"——下巴上多了一颗我哥从来没有过的痣。
  - path: final-chapters/ch03.md
    hook: 我把房产证捏到掌心起汗——想清楚了——以本省双金奥赛金牌的名义起誓我家四口都死在这套别墅里。
  - path: final-chapters/ch04.md
    hook: 假妈妈那一巴掌让我猛然明白——五张脸的痣、痕、喉结、疤、耳坠孔全部对不上。
  - path: final-chapters/ch05.md
    hook: 我把短裤口袋里那张牛皮纸按到指节抵住缝线为止——下一秒省部刑侦的车进巷。
  - path: final-chapters/ch06.md
    hook: 字条上只有一行字——'我在别墅的角落发现了巨量螯合剂'——武警进门，假家人脸上的笑还在。
  - path: final-chapters/ch07.md
    hook: 我哥哥的尸体不再是尸体——他被人打碎，铸进了厨房西墙——直到第七十一小时顾敬之把那枚 IMO 金牌从我手心拿过去替我别回袖口。
  - path: final-chapters/ch08.md
    hook: 第八张是地下室那盏吊灯灯罩内侧——我哥用马克笔写下'小烟,藏好,别出来'。
  - path: final-chapters/ch09.md
    hook: 一审判决——五人全部死刑——上诉权依法保留，但裴队呈交补充证据。
  - path: final-chapters/ch10.md
    hook: 白鸢尾境外组织·境内执行链——他们原本计划在三日之内把我送到境外。
  - path: final-chapters/ch11.md
    hook: 我把那枚 IMO 金牌按进了袖口——我已经选定了京市公安大学痕检系。
