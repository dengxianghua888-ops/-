    ch01: "烽火升空呼唤少年承诺——凌霄寒会来吗？"
    ch02: "柳如烟经过时那抹笑几不可见——她接下来要做什么？"
    ch03: "柳如烟指缝间的笑容暴露伪装——女主即将遭受更大迫害"
    ch04: "他不允许我死。不是因为心疼。是因为死了，就真的离开了。"
    ch05: "赤鹰部图腾在烛火下泛着冷光。来了。"
    ch06: "给靖安王留了份大礼。收好。"
    ch07: "三年里最伤她的那个人，此刻正坐在堂上。"
    ch08: "不怪你——错过这些年，往后莫再辜负。"
    ch09: "失了人，又失了权。楚怀璟的好日子，到头了。"
    ch10: "小心伤了孩子。（全文完）"

