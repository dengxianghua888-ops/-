chapters:
  - id: ch01
    file: final-chapters/ch01.md
    hook: "“顺便，我妈的海鲜档、顾砚的冷链车队、我弟的团购仓，也一起走。”"
  - id: ch02
    file: final-chapters/ch02.md
    hook: "温控报警红灯跳出来时，马成站在门口笑：“现在知道谁管电了？”"
  - id: ch03
    file: final-chapters/ch03.md
    hook: "我妈把灯牌递给我，冷声说：“老客户，我带走。”"
  - id: ch04
    file: final-chapters/ch04.md
    hook: "顾砚把调度平板推到我面前，低声问：“车队今晚全部改线，你点头吗？”"
  - id: ch05
    file: final-chapters/ch05.md
    hook: "许阳按下小程序弹窗，东区三千个团购订单同时跳到新港自提点。"
  - id: ch06
    file: final-chapters/ch06.md
    hook: "白蔓的发布会刚开场，第一排酒楼老板已经起身走了。"
  - id: ch07
    file: final-chapters/ch07.md
    hook: "我说：“那就让它们在这里等检查。”"
  - id: ch08
    file: final-chapters/ch08.md
    hook: "我看着他，只问：“对公凭证呢？”"
  - id: ch09
    file: final-chapters/ch09.md
    hook: "冷链港大屏亮起那一刻，老市场东区第一次在清晨六点黑了灯。"
  - id: ch10
    file: final-chapters/ch10.md
    hook: "白蔓盯着二百八十元的日销表，脸上的直播滤镜终于碎了。"
  - id: ch11
    file: final-chapters/ch11.md
    hook: "他终于低声说：“许老板，条件你开。”"
  - id: ch12
    file: final-chapters/ch12.md
    hook: "他低下头，说让我爸插手的人，是我没拦住。"
  - id: ch13
    file: final-chapters/ch13.md
    hook: "我说你不是最讲规则吗，现在轮到你进规则里说话。"
  - id: ch14
    file: final-chapters/ch14.md
    hook: "“顾董，现在我是这里的规则制定者。”"
  - id: ch15
    file: final-chapters/ch15.md
    hook: "这条线，我会亲自守住。"

