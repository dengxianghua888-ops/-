chapters:
  count: 15
  target_range_chars: 500-1200
  hooks:
    - 没有下一个了。
    - 狼神台雪夜里，第二枚雪铃暗了半边。
    - 拓跋赫亲手掰开阿泠的手指，把我抱进南帐。
    - 乌兰珠指着我身上的假鞭痕，要阿泠认罪。
    - 剜雪瞳的银刀落下前，阿泠把阿宝推到身后。
    - 阿泠摸着我的脸问：还剩几枚铃？
    - 最后一枚雪铃粉碎。
    - 阿宝磕下头，叫：额吉。
    - 他说：“汗王从来不能有子。”
    - 拓跋赫问她想要什么，她答：王储印。
    - 阿宝翻开军马账册，指向雪巫祭司府的私印。
    - 乌兰珠的旧药渣被倒在金帐中央，奶酒缸案重开。
    - 拓跋赫终于知道，八个儿子不是他的福，是阿泠的命。
    - 拓跋赫跪在雪坑前，第一次喊阿泠的名字。
    - 阿宝接过金狼王印，掌心像握着阿娘碎掉的雪铃。

