chapters:
  count: 15
  min_chars_per_chapter: 500
  max_chars_per_chapter: 1200
  files:
  - path: final-chapters/ch01.md
    hook: “我举报仁和医院伪造病历。”我说，“我养父母和哥哥已经死了，证据在仁和医院病理楼。”
  - path: final-chapters/ch02.md
    hook: 三份出院记录并排铺开，三个人的电子签名，竟然像从同一支笔里复制出来。
  - path: final-chapters/ch03.md
    hook: “你不是她。”
  - path: final-chapters/ch04.md
    hook: 亲缘初检报告弹出：样本符合母女关系。我的报警，被认定疑似虚假。
  - path: final-chapters/ch05.md
    hook: 门岗抓拍里，贺闻川身后跟着一只贴着冷链标签的蓝色箱子。
  - path: final-chapters/ch06.md
    hook: 封存单刚贴上蜡块库，医院信息科却提交了系统宕机报告。
  - path: final-chapters/ch07.md
    hook: 冷链曲线的凌晨断崖温差，正好落在林家三口所谓出院之后。
  - path: final-chapters/ch08.md
    hook: 发布会大屏黑了一秒，随后跳出一行字：该编号蜡块已被申请销毁。
  - path: final-chapters/ch09.md
    hook: 专家复核后摘下眼镜：这不是活检流程，这是死亡时间被改写了。
  - path: final-chapters/ch10.md
    hook: 未婚夫在走廊拦住她，低声说：你再查下去，解除收养协议就白签了。
  - path: final-chapters/ch11.md
    hook: 她拿到养父母留下的原始录音，第一句却是：知夏，别回林家。
  - path: final-chapters/ch12.md
    hook: 二次 DNA 复核启动前，冻存旧血样的封条被人割开。
  - path: final-chapters/ch13.md
    hook: 庭审直播中，未婚夫否认全部指控，林知夏却申请播放那段退婚语音。
  - path: final-chapters/ch14.md
    hook: 检察官翻到下一页：“贺夫人，请确认，最后一次受益人变更申请，是不是你递交的？”
  - path: final-chapters/ch15.md
    hook: 录取通知重新送到我手里，这一次抬头是公安司法鉴定中心。我推开鉴定中心的门，第一次没有回头。
